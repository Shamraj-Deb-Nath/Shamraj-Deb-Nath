<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Shamraj Deb Nath, Computer Science and Engineering student exploring machine learning, NLP, and automation.">
